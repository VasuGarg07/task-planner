services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: vasug
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: task_planner_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "vasug", "-d", "task_planner_db"]
      interval: 3s
      retries: 20

volumes:
  pgdata: