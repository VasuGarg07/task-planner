services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: vasug
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: task_planner_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "vasug", "-d", "task_planner_db"]
      interval: 3s
      retries: 20

  migrate:
    build: ./backend
    command: ["/app/.venv/bin/python", "migrate.py"]
    environment:
      DATABASE_URL: postgresql://vasug:${DB_PASSWORD}@db:5432/task_planner_db
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://vasug:${DB_PASSWORD}@db:5432/task_planner_db
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"

volumes:
  pgdata:
